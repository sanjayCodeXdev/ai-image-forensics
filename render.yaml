services:
  - type: web
    name: ai-image-forensics-api
    runtime: python
    rootDir: backend
    pythonVersion: "3.11"
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: ALLOWED_ORIGINS
        value: "https://sanjayCodeXdev.github.io,https://sanjayCodeXdev.github.io/ai-image-forensics,https://ai-image-forensics.vercel.app,https://ai-image-forensics-sanjayCodeXdev.vercel.app"
    plan: free
